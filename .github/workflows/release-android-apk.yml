name: Build Android APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Tag → signed APKs only. Quality (lint/typecheck/arch) stays on ci.yml /
  # local; skipping it here avoids a second full npm install before Gradle.
  build:
    runs-on: ubuntu-latest

    # Build both product flavors in parallel — one matrix leg each, on its own
    # runner (isolated .env / gradle config / build outputs).
    strategy:
      fail-fast: false
      matrix:
        include:
          - APP_FLAVOR: global
          - APP_FLAVOR: cn

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euo pipefail
          # Drop unused GH-hosted toolchains. Do not remove /usr/local/lib/android
          # itself — setup-android@v4 recreates it without sudo and hits EACCES.
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/system-images || true
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Release signing + Firebase config from GitHub Secrets (base64-encoded).
      # Secrets: FS_ENV_<FLAVOR>_FILE, FS_KEYSTORE_<FLAVOR>_FILE,
      # FS_GOOGLE_SERVICES_JSON (global). keystore.properties via prebuild.
      - name: Decode CI secrets for ${{ matrix.APP_FLAVOR }}
        env:
          APP_FLAVOR: ${{ matrix.APP_FLAVOR }}
          FS_ENV_GLOBAL_FILE: ${{ secrets.FS_ENV_GLOBAL_FILE }}
          FS_ENV_CN_FILE: ${{ secrets.FS_ENV_CN_FILE }}
          FS_KEYSTORE_GLOBAL_FILE: ${{ secrets.FS_KEYSTORE_GLOBAL_FILE }}
          FS_KEYSTORE_CN_FILE: ${{ secrets.FS_KEYSTORE_CN_FILE }}
          FS_GOOGLE_SERVICES_JSON: ${{ secrets.FS_GOOGLE_SERVICES_JSON }}
        run: |
          set -euo pipefail
          FLAVOR_UPPER=$(echo "${APP_FLAVOR}" | tr '[:lower:]' '[:upper:]')
          ENV_SECRET_VAR="FS_ENV_${FLAVOR_UPPER}_FILE"
          KEYSTORE_SECRET_VAR="FS_KEYSTORE_${FLAVOR_UPPER}_FILE"
          KEYSTORE_PATH="release.${APP_FLAVOR}.keystore"

          ENV_B64="${!ENV_SECRET_VAR:-}"
          [ -n "${ENV_B64}" ] || { echo "${ENV_SECRET_VAR} is not set"; exit 1; }

          KEYSTORE_B64="${!KEYSTORE_SECRET_VAR:-}"
          [ -n "${KEYSTORE_B64}" ] || { echo "${KEYSTORE_SECRET_VAR} is not set"; exit 1; }

          if [ "${APP_FLAVOR}" = "global" ]; then
            [ -n "${FS_GOOGLE_SERVICES_JSON:-}" ] || { echo "FS_GOOGLE_SERVICES_JSON is not set"; exit 1; }
          fi

          umask 077
          mkdir -p android/app

          printf '%s' "${ENV_B64}" | base64 -d > .env
          printf '%s' "${KEYSTORE_B64}" | base64 -d > "android/app/${KEYSTORE_PATH}"
          if [ "${APP_FLAVOR}" = "global" ]; then
            printf '%s' "$FS_GOOGLE_SERVICES_JSON" | base64 -d > android/app/google-services.json
          fi

          test -s .env
          test -s "android/app/${KEYSTORE_PATH}"
          if [ "${APP_FLAVOR}" = "global" ]; then
            test -s android/app/google-services.json
          fi
        shell: bash

      - name: Prebuild ${{ matrix.APP_FLAVOR }} (sync env to Android)
        run: npm run prebuild:android:${{ matrix.APP_FLAVOR }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # v4+ required: Google stopped serving legacy `tools` SDK package.
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission
        run: chmod +x android/gradlew

      # GitHub-only build knobs (do not change local gradle.properties defaults):
      # - arm64-v8a only (matches repo default; skips emulator ABIs)
      # - skip PNG crunch / vital lint to cut disk + peak memory
      # - no Gradle dependency cache restore (was filling the runner disk)
      - name: Build ${{ matrix.APP_FLAVOR }} APK
        env:
          APP_FLAVOR: ${{ matrix.APP_FLAVOR }}
          ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
          ORG_GRADLE_PROJECT_android.enablePngCrunchInReleaseBuilds: "false"
          ORG_GRADLE_PROJECT_android.enableAaptPngCrunch: "false"
        run: |
          GRADLE_FLAVOR="$(echo "${APP_FLAVOR}" | awk '{print toupper(substr($0,1,1)) tolower(substr($0,2))}')"
          cd android
          ./gradlew "assemble${GRADLE_FLAVOR}Release" \
            -x lint -x lintVitalAnalyzeRelease -x test \
            --no-daemon \
            --no-build-cache \
            --console=plain \
            --stacktrace

      - name: Copy APK
        env:
          APP_FLAVOR: ${{ matrix.APP_FLAVOR }}
        run: |
          APK_PATH="android/app/build/outputs/apk/${APP_FLAVOR}/release/app-${APP_FLAVOR}-release.apk"
          cp "${APK_PATH}" "esp-rainmaker-home-${APP_FLAVOR}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: esp-rainmaker-home-${{ matrix.APP_FLAVOR }}.apk
          path: esp-rainmaker-home-${{ matrix.APP_FLAVOR }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create Release & Upload APKs
        uses: softprops/action-gh-release@v2
        with:
          name: "ESP Rainmaker Home ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
